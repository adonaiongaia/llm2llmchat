[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm2llmchat"
version = "0.1.0"
description = "A Linux desktop app for ordered conversations between multiple local language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7"]

[project.optional-dependencies]
keyring = ["keyring>=24"]
build = ["pyinstaller>=6.10"]
test = ["pytest>=8"]

[project.scripts]
llm2llmchat = "llm2llmchat.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
